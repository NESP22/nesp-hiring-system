# Dependabot version updates.
#
# Ecosystems below match the manifests actually present in this repo.
# Minor + patch bumps are grouped into a single PR per ecosystem to keep the
# review queue small; major bumps arrive separately so they get real attention.
#
# This file drives version updates only. Dependabot *security* alerts and
# security updates are a repository setting (Settings -> Advanced Security).
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: America/New_York
  open-pull-requests-limit: 5
  commit-message:
    prefix: chore(deps)
  groups:
    actions-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: composer
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: America/New_York
  open-pull-requests-limit: 5
  commit-message:
    prefix: chore(deps)
  groups:
    composer-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: docker
  directory: /docker/php
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: America/New_York
  open-pull-requests-limit: 5
  commit-message:
    prefix: chore(deps)
  groups:
    docker-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: docker
  directory: /docker/render
  schedule:
    interval: weekly
    day: monday
    time: 09:00
    timezone: America/New_York
  open-pull-requests-limit: 5
  commit-message:
    prefix: chore(deps)
  groups:
    docker-minor-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
